<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Checkout</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body style="color: white; padding: 20px; font-family: sans-serif;">

        <div class="app">
            <!--Page title at top of page-->
            <div class="page-title">
                <img src="{{ url_for('static', filename='assets/page-title.png') }}">
            </div>

            <img src="{{ url_for('static', filename='assets/divider.png') }}">

            <h1>Forge Checkout</h1>
            
            <!-- This form sends a POST request to your submit_order route -->
            <form action="{{ url_for('submit_order') }}" method="POST" style="margin-top: 20px;">
                <div style="margin-bottom: 15px;">
                    <label>First Name:</label><br>
                    <input type="text" name="first_name" required style="padding: 6px; margin-top: 5px;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label>Last Name:</label><br>
                    <input type="text" name="last_name" required style="padding: 6px; margin-top: 5px;">
                </div>
                
                <button type="submit" style="padding: 10px 20px; background-color: darkred; color: white; border: none; cursor: pointer;">Submit Order</button>
            </form>

            <br>
            <a href="{{ url_for('view_cart') }}" style="color: orange;">Return to Cart</a>

            <img src="{{ url_for('static', filename='assets/divider.png') }}">
        </div>

    </body>
</html>
