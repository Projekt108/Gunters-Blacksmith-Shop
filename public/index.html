<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunter's Blacksmith Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!--Makes sure the page fits on mobile devices-->
    <div class="app">

        <!--Page title at top of page-->
        <div class="page-title">
            <img src="assets/page-title.png">
        </div>

        <!--Add to cart title-->
        <div class="title-headings">
            <img src="assets/add-to-cart-title.png">
        </div>

        <!--Shop floor with items section-->
        <div class="shop-floor">

            <!--Horizontal scrollable bar with items-->
            <div class="scroll-bar">
                <button class="item" data-item="armor">
                    <img src="assets/armor.png">
                </button>
                <button class="item" data-item="chainmail">
                    <img src="assets/chainmail.png">
                </button>
                <button class="item" data-item="cooking-pot">
                    <img src="assets/cooking-pot.png">
                </button>
                <button class="item" data-item="sword">
                    <img src="assets/sword.png">
                </button>

                <!--DELETE OR REPLACE THIS LATER!-->
                <!--ONLY FOR TESTING THE SCROLL BAR!-->
                <button class="item" data-item="armor">
                    <img src="assets/armor.png">
                </button>
                <button class="item" data-item="chainmail">
                    <img src="assets/chainmail.png">
                </button>

            </div>

        </div>

        <!--Order status title-->
        <!--Maybe we could move this to another webpage?-->
        <div class="title-headings">
            <img src="assets/queue-title.png">
        </div>

        <!--Where all the added orders will show up-->
        <div id = "queue">

        </div>

        
    </div>

    <!--Popup dialog box for when something is clicked-->
    <div id="item-dialog" class="dialog-hidden">
        <div class="dialog-content">
            <h2 id="dialog-title"></h2>
            <p id="dialog-price"></p>
            <p id="dialog-time"></p>
            
            <input type="text" id="customer-name" placeholder="Enter your name">
            <button id="confirm-order-btn">Place Order</button>
            <button id="close-dialog-btn">Cancel</button>
        </div>
    </div>

    <!--Links the JavaScript so the page can use it, somehow I forgot to do this before-->
    <script src="script.js"></script>
</body>
</html>
