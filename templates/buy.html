<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Buy {{ item_name }}</title>
        
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body style="text-align: center; color: white; padding-top: 50px;">

        <div class="app">
            <!--Page title at top of page-->
            <div class="page-title">
                <img src="{{ url_for('static', filename='assets/page-title.png') }}">
            </div>

            <img src="{{ url_for('static', filename='assets/divider.png') }}">

            <h1>Purchase {{ item_name | replace('-', ' ') | title }}</h1>
            
            <!--Shows price from app.py-->
            <p style="font-size: 24px; color: gold; margin-bottom: 20px;">
                Price: ${{ "%.2f"|format(price) }}
            </p>
            
            <!--Loads the image based on the item clicked-->
            <img src="{{ url_for('static', filename='assets/' + item_name + '.png') }}" style="max-width: 200px; margin: 20px auto;">

            <!--The form that triggers the Python add_to_cart function-->
            <form action="{{ url_for('add_to_cart', item_name=item_name) }}" method="POST">
                <input type="number" id="quantity" name="quantity" value="1" min="1" max ="10" style="padding: 10px; font-size: 16px; margin: 10px 0;">
                <button type="submit" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: darkred; color: white; border: none;">Add to Order</button>
            </form>

            <br><br>
            <a href="{{ url_for('shop') }}" style="color: orange;">Return to Shop</a>

            <img src="{{ url_for('static', filename='assets/divider.png') }}">
        </div>

    </body>
</html>
