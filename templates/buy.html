<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buy {{ item_name }}</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="text-align: center; color: white; padding-top: 50px;">

    <h1>Purchase {{ item_name }}</h1>
    
    <!-- Loads the image based on item clicked -->
    <img src="{{ url_for('static', filename='assets/' + item_name + '.png') }}" alt="{{ item_name }}" style="max-width: 200px; margin: 20px auto;">

    <!-- The form that triggers the Python add_to_cart function -->
    <form action="{{ url_for('add_to_cart', item_name=item_name) }}" method="POST">
        <button type="submit" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: darkred; color: white; border: none;">Add to Cart</button>
    </form>

    <br><br>
    <a href="{{ url_for('home') }}" style="color: orange;">Return to Shop</a>

</body>
</html>
