<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunter's Shop - Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <!--Makes sure the page fits on mobile devices-->
    <div class="app">

        <!--Nav bar at top of the page-->
        <nav class="tab-bar">
            <a href="{{ url_for('home') }}" class="tab-link {{ 'active' if request.path == '/' else '' }}">Home</a>
            <a href="{{ url_for('shop') }}" class="tab-link {{ 'active' if request.path == '/shop' else '' }}">Shop</a>
            <a href="{{ url_for('view_cart') }}" class="tab-link {{ 'active' if request.path == '/cart' else '' }}">Cart</a>
            <a href="{{ url_for('queue') }}" class="tab-link {{ 'active' if request.path == '/queue' else '' }}">Queue</a>
            <a href="{{ url_for('about') }}" class="tab-link {{ 'active' if request.path == '/about' else '' }}">About</a>
            <a href="{{ url_for('contact') }}" class="tab-link {{ 'active' if request.path == '/contact' else '' }}">Contact</a>
            <a href="{{ url_for('staff') }}" class="tab-link {{ 'active' if request.path == '/staff' else '' }}">Staff</a>
        </nav>

        <!--Page title at top of page-->
        <div class="page-title">
            <img src="{{ url_for('static', filename='assets/page-title.png') }}">
        </div>

        <img src="{{ url_for('static', filename='assets/divider.png') }}">

        <!--Featured items section, maybe could have a discount?-->
        <div style="padding: 20px 0; text-align: center;">
            <h1 style="font-size: clamp(1.5rem, 7vw, 2.5rem); margin-bottom: 20px; white-space: nowrap;">Featured Items</h1>
            
            <div class="shop-grid">
                <a class="item" href="{{ url_for('buy_page', item_name='sword') }}">
                    <img src="{{ url_for('static', filename='assets/sword.png') }}">
                </a>
                
                <a class="item" href="{{ url_for('buy_page', item_name='helmet') }}">
                    <img src="{{ url_for('static', filename='assets/helmet.png') }}">
                </a>
                
                <a class="item" href="{{ url_for('buy_page', item_name='chestplate') }}">
                    <img src="{{ url_for('static', filename='assets/chestplate.png') }}">
                </a>
                
                <a class="item" href="{{ url_for('buy_page', item_name='cooking-pot') }}">
                    <img src="{{ url_for('static', filename='assets/cooking-pot.png') }}">
                </a>
            </div>

            <!--Button to go to the full shop -->
            <div style="margin-top: 30px;">
                <a href="{{ url_for('shop') }}">
                    <button style="background-color: #8b5a2b; color: #e4cc94; border: 2px solid #5a3a1a; padding: 15px 30px; cursor: pointer; border-radius: 8px; font-size: 18px; font-weight: bold; width: 80%;">View Full Shop</button>
                </a>
            </div>
        </div>

        <img src="{{ url_for('static', filename='assets/divider.png') }}">
        
    </div>

</body>
</html>
