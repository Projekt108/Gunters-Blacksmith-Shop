<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunter's Shop - Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <div class="app">

        <!--Tab bar at the top-->
        <nav class="tab-bar">
            <a href="{{ url_for('home') }}" class="tab-link {{ 'active' if request.path == '/' else '' }}">Home</a>
            <a href="{{ url_for('shop') }}" class="tab-link {{ 'active' if request.path == '/shop' else '' }}">Shop</a>
            <a href="{{ url_for('about') }}" class="tab-link {{ 'active' if request.path == '/about' else '' }}">About</a>
            <a href="{{ url_for('queue') }}" class="tab-link {{ 'active' if request.path == '/queue' else '' }}">Queue</a>
            <a href="{{ url_for('contact') }}" class="tab-link {{ 'active' if request.path == '/contact' else '' }}">Contact</a>
            <a href="{{ url_for('staff') }}" class="tab-link {{ 'active' if request.path == '/staff' else '' }}">Staff</a>
        </nav>


        <!--Page title at top of page-->
        <div class="page-title">
            <img src="{{ url_for('static', filename='assets/page-title.png') }}" alt="Page Title">
        </div>

        <img src="{{ url_for('static', filename='assets/divider.png') }}" alt="Divider">

        <!-- Individual items title -->
        <div style="color: white; text-align: center; padding: 20px; font-family: 'Times New Roman', Times, serif;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0px;">The Shop</h1>
        </div>
        
        <!--The shop floor two-wide cloumn grid thingy-->
        <!--Individual items-->
        <div class="shop-grid">
            <a class="item" href="{{ url_for('buy_page', item_name='sword') }}">
                <img src="{{ url_for('static', filename='assets/sword.png') }}" alt="Sword">
            </a>
            
            <a class="item" href="{{ url_for('buy_page', item_name='helm') }}">
                <img src="{{ url_for('static', filename='assets/helm.png') }}" alt="Helm">
            </a>
            
            <a class="item" href="{{ url_for('buy_page', item_name='chestplate') }}">
                <img src="{{ url_for('static', filename='assets/chestplate.png') }}" alt="Chestplate">
            </a>
            
            <a class="item" href="{{ url_for('buy_page', item_name='cooking-pot') }}">
                <img src="{{ url_for('static', filename='assets/cooking-pot.png') }}" alt="Cooking Pot">
            </a>

            <a class="item" href="{{ url_for('buy_page', item_name='armored-boots') }}">
                <img src="{{ url_for('static', filename='assets/armored-boots.png') }}" alt="Armored Boots">
            </a>
            
            <a class="item" href="{{ url_for('buy_page', item_name='healing-brew') }}">
                <img src="{{ url_for('static', filename='assets/healing-brew.png') }}" alt="Healing Brew">
            </a>

            <a class="item" href="{{ url_for('buy_page', item_name='refined-saddle') }}">
                <img src="{{ url_for('static', filename='assets/refined-saddle.png') }}" alt="Refined Saddle">
            </a>

            <a class="item" href="{{ url_for('buy_page', item_name='chalice') }}">
                <img src="{{ url_for('static', filename='assets/chalice.png') }}" alt="Chalice">
            </a>
        </div>

        <img src="{{ url_for('static', filename='assets/divider.png') }}" alt="Divider">


        <!-- Bundle items title -->
        <div style="color: white; text-align: center; padding: 20px; font-family: 'Times New Roman', Times, serif;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0px;">Bundles</h1>
        </div>


        <!--Bundles-->
        <div class="shop-grid">
            <a class="item" href="{{ url_for('buy_page', item_name='chalice-saddle') }}">
                <img src="{{ url_for('static', filename='assets/chalice-saddle.png') }}" alt="Chalice & Saddle">
            </a>

            <a class="item" href="{{ url_for('buy_page', item_name='helmet-cooking-pot') }}">
                <img src="{{ url_for('static', filename='assets/helmet-cooking-pot.png') }}" alt="Helmet & Cooking Pot">
            </a>

            <a class="item" href="{{ url_for('buy_page', item_name='sword-potion') }}">
                <img src="{{ url_for('static', filename='assets/sword-potion.png') }}" alt="Sword & Potion">
            </a>

            <a class="item" href="{{ url_for('buy_page', item_name='full-set') }}">
                <img src="{{ url_for('static', filename='assets/full-set.png') }}" alt="Full Set">
            </a>
        </div>

        <img src="{{ url_for('static', filename='assets/divider.png') }}" alt="Divider">
    </div>

</body>
</html>
