<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining Game - Gunter's</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <div class="app">
        <!-- Tab Bar -->
        <nav class="tab-bar">
            <a href="{{ url_for('home') }}" class="tab-link {{ 'active' if request.path == '/' else '' }}">Home</a>
            <a href="{{ url_for('shop') }}" class="tab-link {{ 'active' if request.path == '/shop' else '' }}">Shop</a>
            <a href="{{ url_for('view_cart') }}" class="tab-link {{ 'active' if request.path == '/cart' else '' }}">Cart</a>
            <a href="{{ url_for('queue') }}" class="tab-link {{ 'active' if request.path == '/queue' else '' }}">Queue</a>
            <a href="{{ url_for('about') }}" class="tab-link {{ 'active' if request.path == '/about' else '' }}">About</a>
            <a href="{{ url_for('contact') }}" class="tab-link {{ 'active' if request.path == '/contact' else '' }}">Contact</a>
            <a href="{{ url_for('game') }}" class="tab-link {{ 'active' if request.path == '/game' else '' }}">Game</a>
            <a href="{{ url_for('staff') }}" class="tab-link {{ 'active' if request.path == '/staff' else '' }}">Staff</a>
        </nav>

        <!-- Page title -->
        <div class="page-title">
            <img src="{{ url_for('static', filename='assets/page-title.png') }}">
        </div>

        <img src="{{ url_for('static', filename='assets/divider.png') }}">

        <!-- The Game Area -->
        <div style="padding: 30px 20px; text-align: center;">
            
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Gunter's Mine</h1>
            
            <!-- The Cash Display -->
            <div style="background-color: #222; border: 2px solid #5a3a1a; border-radius: 8px; padding: 20px; margin-bottom: 20px;">
                <h2 style="font-size: 1.5rem; margin-bottom: 10px;">Gold Mined:</h2>
                <h1 id="cash-display" style="color: #e4cc94; font-size: 3rem;">0</h1>
            </div>

            <!-- The Clicker Button -->
            <button id="active-income" style="background-color: #8b5a2b; color: #e4cc94; border: 2px solid #5a3a1a; padding: 20px; cursor: pointer; border-radius: 8px; font-size: 24px; font-weight: bold; width: 100%;">
                ⛏️ MINE (+$1)
            </button>
            
            <h2 style="margin-top: 40px; margin-bottom: 15px;">Forge Upgrades</h2>
            
            <!-- The Upgrades will appear here -->
            <div id="upgrades-container" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- JavaScript will generate the buttons here -->
            </div>
            
        </div>

        <img src="{{ url_for('static', filename='assets/divider.png') }}">
    </div>

    <!-- The Game Logic -->
    <script>
        let game_state = { cash: 0, upgrades: [] };
        let timers = {};

        const upgradeImages = {
            1: 'river-panning.png',
            2: 'serfs.png',
            3: 'mineshafts.png',
            4: 'quarries.png' 
        };

        async function loadGameState() {
            try {
                const response = await fetch('/get_game_state');
                game_state = await response.json();
                
                // FAIL-SAFE: If the save file is broken, manually load the defaults
                if (!game_state.upgrades || game_state.upgrades.length === 0) {
                    game_state.upgrades = [
                        {id: 1, name: "River Panning", level: 0, currentcost: 10, money_generated: 4, time: 2},
                        {id: 2, name: "Serfs", level: 0, currentcost: 50, money_generated: 20, time: 5},
                        {id: 3, name: "Mineshafts", level: 0, currentcost: 1000, money_generated: 150, time: 10},
                        {id: 4, name: "Quarries", level: 0, currentcost: 10000, money_generated: 450, time: 15}
                    ];
                }

                // Reset timers
                game_state.upgrades.forEach(upgrade => {
                    timers[upgrade.id] = {time_elapsed:0};
                });
                
                updateDisplay();
                renderUpgrades();
            } catch (error) {
                console.error("Failed to load game state:", error);
            }
        }

        function updateDisplay() {
            document.getElementById('cash-display').textContent = game_state.cash.toFixed(2);
        }

        function renderUpgrades() {
            const container = document.getElementById('upgrades-container');
            container.innerHTML = ''; 

            game_state.upgrades.forEach(upgrade => {
                const wrapper = document.createElement('div');
                wrapper.style.cssText = "position: relative; width: 100%; margin-bottom: 25px; display: block;";
                
                const imgFilename = upgradeImages[upgrade.id] || 'page-title.png';

                wrapper.innerHTML = `
                    <img src="/static/assets/${imgFilename}" style="width: 100%; display: block; border: 2px solid #5a3a1a; border-radius: 8px;">
                    
                    <!--Money per second slot -->
                    <div style="position: absolute; top: 19%; left: 80%; width: 50%; text-align: left; color: #e4cc94; font-weight: bold; font-size: clamp(10px, 3vw, 16px); text-shadow: 1px 1px 2px black;">
                        +$${upgrade.money_generated} / ${upgrade.time}s
                    </div>

                    <!--Current Cost slot -->
                    <div style="position: absolute; top: 41%; left: 51%; width: 50%; text-align: left; color: gold; font-weight: bold; font-size: clamp(12px, 3.5vw, 18px); text-shadow: 1px 1px 2px black;">
                        $${upgrade.currentcost}
                    </div>

                    <!--Buy Button slot-->
                    <div onclick="buyUpgrade(${upgrade.id})" style="position: absolute; top: 45%; right: 0%; transform: translateY(-50%); width: 30%; height: 40%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: clamp(10px, 2.5vw, 14px); text-shadow: 1px 1px 2px black; cursor: pointer;">
                        BUY
                    </div>

                    <!-- THE PROGRESS BAR -->
                    <div class="progress-bar-container" style="margin-top: 5px;">
                        <div class="progress-fill" id="progress-${upgrade.id}" style="width: 0%; background-color: #8b5a2b;"></div>
                    </div>
                `;

                container.appendChild(wrapper);
            });
        }

        function buyUpgrade(id) {
            const upgrade = game_state.upgrades.find(u => u.id === id);

            if (upgrade && game_state.cash >= upgrade.currentcost) {
                game_state.cash -= upgrade.currentcost;
                upgrade.level += 1;
                upgrade.currentcost = Math.floor(upgrade.currentcost * 1.5); 
                
                if (timers[upgrade.id]) {
                    timers[upgrade.id].time_elapsed = 0;
                }
                
                updateDisplay();
                renderUpgrades();
            } else {
                alert("Not enough gold!");
            }
        }

        // Clicking the main mine button
        document.getElementById('active-income').addEventListener('click', function() {
            game_state.cash += 1;
            updateDisplay();
        });

        // Passive income & Progress Bars
        setInterval(() => {
            let earnedThisTick = 0;
            
            if (game_state.upgrades) {
                game_state.upgrades.forEach(upgrade => {
                    if (upgrade.level > 0 && timers[upgrade.id]) {
                        timers[upgrade.id].time_elapsed += 0.1;
                        
                        let progressPercent = (timers[upgrade.id].time_elapsed / upgrade.time) * 100;
                        
                        const progressBar = document.getElementById(`progress-${upgrade.id}`);
                        if (progressBar) {
                            progressBar.style.width = `${progressPercent}%`;
                        }

                        if (timers[upgrade.id].time_elapsed >= upgrade.time) {
                            earnedThisTick += (upgrade.money_generated * upgrade.level);
                            timers[upgrade.id].time_elapsed = 0; 
                        }
                    }
                });
            }

            if (earnedThisTick > 0) {
                game_state.cash += earnedThisTick;
                updateDisplay();
            }
        }, 100); 

        // Save to backend
        setInterval(() => {
            fetch('/update_game_state', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(game_state)
            });
        }, 1000);

        loadGameState();
    </script>
</body>
</html>
